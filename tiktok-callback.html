<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>TikTok 連携</title>
<style>
body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; background: #fbfaf6; color: #1d1f2b; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px; line-height: 1.7; }
code { display: block; word-break: break-all; background: #fff; border: 2px solid #e7e4da; border-radius: 10px; padding: 12px; }
button { margin-top: 10px; font-weight: 700; padding: 8px 16px; border-radius: 10px; border: 2px solid #e7e4da; background: #fff; }
@media (prefers-color-scheme: dark) { body { background: #14161f; color: #f1f1f4; } code, button { background: #1d2030; color: #f1f1f4; border-color: #2c3045; } }
</style>
</head>
<body>
<main>
<h1>TikTok 連携</h1>
<p id="msg">ログインの結果を確認しています…</p>
<code id="code"></code>
<button type="button" id="copy" hidden>コピーする</button>
<p>このコードを GitHub の Actions →「TikTok の連携」→「Run workflow」の code 欄に貼って実行してください（10分ほどで無効になります）。</p>
</main>
<script>
var q = new URLSearchParams(location.search);
var c = q.get("code"), e = q.get("error_description") || q.get("error");
var msg = document.getElementById("msg"), box = document.getElementById("code"), btn = document.getElementById("copy");
if (c) { msg.textContent = "ログインできました。次のコードをコピーしてください。"; box.textContent = c; btn.hidden = false; }
else { msg.textContent = e ? "ログインできませんでした: " + e : "コードがありません（TikTok のログイン画面から開いてください）。"; }
btn.addEventListener("click", function () { navigator.clipboard && navigator.clipboard.writeText(c).then(function () { btn.textContent = "コピーしました"; }); });
</script>
</body>
</html>
